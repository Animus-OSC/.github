<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="title desc">
  <title id="title">ANIMUS | Engineering the infrastructure of trust</title>
  <desc id="desc">A dark graphite brand banner with cyan and electric green architectural light, a geometric Animus monogram, and engineering company positioning.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03070b"/>
      <stop offset="0.52" stop-color="#07141a"/>
      <stop offset="1" stop-color="#020709"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#20e0eb"/>
      <stop offset="0.55" stop-color="#00eaa4"/>
      <stop offset="1" stop-color="#a0f84b"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#42eeff"/>
      <stop offset="0.55" stop-color="#07e7c5"/>
      <stop offset="1" stop-color="#a3f54a"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0beec6" stop-opacity="0.22"/>
      <stop offset="0.56" stop-color="#0beec6" stop-opacity="0.075"/>
      <stop offset="1" stop-color="#0beec6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#36dacf" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="markGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="1600" height="480" fill="url(#background)"/>
  <rect width="1600" height="480" fill="url(#grid)"/>
  <ellipse cx="1228" cy="236" rx="375" ry="350" fill="url(#aura)"/>

  <!-- Sparse architecture, network paths and horizon lines. -->
  <g fill="none" stroke="#26dce1" stroke-opacity="0.12" stroke-width="1.4">
    <path d="M800 420L1590 420M850 370L1590 370M890 320L1580 320M940 270L1570 270"/>
    <path d="M930 50V428M1005 20V437M1100 0V460M1330 0V452M1415 25V455M1510 0V420"/>
    <path d="M800 435C994 322 1065 369 1200 280S1478 180 1580 125"/>
    <path d="M820 452C975 397 1075 415 1220 342S1435 287 1600 316"/>
  </g>
  <g opacity="0.22">
    <rect x="938" y="136" width="17" height="282" fill="#114f57"/>
    <rect x="998" y="96" width="8" height="324" fill="#21878a"/>
    <rect x="1432" y="108" width="12" height="310" fill="#124b58"/>
    <rect x="1486" y="153" width="25" height="266" fill="#0b4851"/>
  </g>
  <path d="M0 455H1600" stroke="url(#signal)" stroke-opacity="0.55" stroke-width="2"/>
  <path d="M0 453H1600" stroke="url(#signal)" stroke-opacity="0.32" stroke-width="9" filter="url(#softGlow)"/>

  <!-- The visual mark is intentionally a geometric motif, not a substitute for the corporate avatar. -->
  <g transform="translate(1210 235)">
    <g fill="#031016" fill-opacity="0.88" stroke="url(#mark)" stroke-width="5" stroke-linejoin="miter">
      <path d="M0 -155L-180 145H-109L3 -45L52 35L96 -26Z"/>
      <path d="M-180 145L-220 209H91L48 145Z"/>
      <path d="M72 -39L221 209H143L29 23Z"/>
    </g>
    <g fill="none" stroke="#1effd2" stroke-opacity="0.62" stroke-width="12" filter="url(#markGlow)">
      <path d="M0 -155L-180 145"/>
      <path d="M-220 209H91"/>
      <path d="M72 -39L221 209"/>
    </g>
    <path d="M-101 96L-44 0L13 96Z" fill="#0be9bb" fill-opacity="0.09" stroke="#40eedc" stroke-opacity="0.45"/>
    <circle cx="0" cy="-155" r="4" fill="#affc69"/>
    <circle cx="-220" cy="209" r="4" fill="#3debf8"/>
    <circle cx="221" cy="209" r="4" fill="#affc69"/>
  </g>

  <!-- Company identity and promise. -->
  <rect x="104" y="100" width="43" height="4" fill="url(#signal)"/>
  <text x="160" y="108" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="5" fill="#68e7df">ENGINEERING COMPANY</text>
  <text x="100" y="242" font-family="Arial, Helvetica, sans-serif" font-size="112" font-weight="800" letter-spacing="13" fill="#edf7f7">ANIMUS</text>
  <text x="105" y="296" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" letter-spacing="1.8" fill="#b4d1d0">Secure systems. Human control.</text>
  <path d="M104 326H680" stroke="url(#signal)" stroke-width="2" opacity="0.8"/>
  <text x="105" y="365" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="2.3" fill="#8baeb2">CONNECTIVITY  /  AI INFRASTRUCTURE  /  LOCAL-FIRST</text>
  <text x="105" y="420" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="3.3" fill="#65a7ac">ANIMUS   ·   EVIDENCE BEFORE CLAIMS</text>
</svg>